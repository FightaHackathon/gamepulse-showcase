name: GamePulse Fusion CI

on:
  push:
    branches:
      - feature/gamepulse-fusion-web
  pull_request:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install pytest -r requirements.txt
      - name: Run Python tests
        run: python -m pytest tests -q
      - name: Compile Python
        run: python -m compileall -q app.py api gamepulse scripts tests
