name: Desktop Tests

on:
  push:
    branches:
      - local-desktop-app
      - 'agent/desktop-*'

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      TWITCH_CLIENT_ID: ""
      TWITCH_CLIENT_SECRET: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Fetch prototype database from Git LFS
        run: git lfs pull --include="data/prototype/gamepulse_prototype.sqlite3"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check patch whitespace
        run: git diff --check

      - name: Run full unittest suite
        run: python -m unittest discover -s tests -q

      - name: Compile project modules
        run: python -m compileall -q app.py gamepulse gamepulse_data scripts tests
