name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Unit tests need the prepared prototype database, but do not need
          # the much larger raw and processed dataset artifacts.
          lfs: false

      - name: Fetch prototype database from Git LFS
        run: git lfs pull --include="data/prototype/gamepulse_prototype.sqlite3"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Run database-build smoke test
        run: python -m unittest tests.test_database -q

      - name: Compile project modules
        run: python -m compileall -q app.py gamepulse scripts tests
